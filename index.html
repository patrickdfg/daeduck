<!-- daeduck 첫 화면: 알고리즘 워크북과 면접 대비 문제집 중 하나를 고르는 페이지 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대덕SW마이스터고 대비 자료</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--sub:#5b6474;--line:#e3e6eb;--accent:#2457d6;--accent-soft:#e8eefc}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#e7eaef;--sub:#9aa3b2;--line:#2c323c;--accent:#7aa2ff;--accent-soft:#232c42}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6;word-break:keep-all}
main{max-width:760px;margin:0 auto;padding:40px 16px 48px}
h1{font-size:1.5rem;margin:0 0 6px}
.lead{color:var(--sub);margin:0 0 28px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;transition:border-color .15s,transform .15s}
a.card:hover,a.card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
.tag{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.card h2{font-size:1.15rem;margin:10px 0 6px}
.card p{margin:0 0 12px;color:var(--sub);font-size:.93rem}
.card ul{margin:0 0 14px;padding-left:18px;font-size:.9rem}
.go{color:var(--accent);font-weight:700;font-size:.92rem}
</style>
</head>
<body>
<main>
<h1>대덕SW마이스터고 대비 자료</h1>
<p class="lead">공부할 자료를 골라 주세요.</p>
<div class="cards">
<a class="card" href="workbook.html">
<span class="tag">문제 풀이</span>
<h2>알고리즘 사고력 워크북</h2>
<p>답안 입력, 자동 저장, 정답·해설 펼치기가 되는 20문제 워크북입니다.</p>
<ul><li>조건 판단과 반복문</li><li>등교 순서 추론</li><li>이진 탐색</li></ul>
<span class="go">워크북 열기 →</span>
</a>
<a class="card" href="interview.html">
<span class="tag">면접 대비</span>
<h2>면접 대비 문제집</h2>
<p>5세트 50문항과 모범답안입니다. 2027학년도 전형요강을 기준으로 만들었습니다.</p>
<ul><li>학교 이해 2세트</li><li>기본 코딩 3세트</li></ul>
<span class="go">문제집 열기 →</span>
</a>
</div>
</main>
</body>
</html>
